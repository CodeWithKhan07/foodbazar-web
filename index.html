<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#4A2A12" />
    <title>FoodBazar POS</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #4a2a12; /* Match splash brown */
        overflow: hidden; /* Prevent elastic bouncing on entire page */
        touch-action: none; /* Let JS components handle their scrolling */
        overscroll-behavior-y: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: auto;
        touch-action: pan-x pan-y;
        overscroll-behavior-y: contain; /* Enable scrolling inside root exclusively */
        -webkit-overflow-scrolling: touch;
      }
      /* Ensure inputs can still be typed in */
      input,
      textarea {
        -webkit-user-select: auto;
        user-select: auto;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
